name: Research Smoke & Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Lint (ruff)
        run: ruff check . --select E,F,W --ignore E501 || true

      - name: Unit & integration tests (pytest + coverage)
        run: |
          python -m pytest -q --tb=short \
            --cov=agents --cov=tools --cov=backtesting --cov=models \
            --cov-report=term-missing

      - name: Smoke test (offline)
        run: python tests/smoke_test.py

      - name: Backtest gate (fixture)
        run: |
          python scripts/run_backtest.py \
            --csv tests/fixtures/klines_mini.csv \
            --symbol TEST --interval 5m --days 1 \
            --out /tmp/test_backtest.json && \
          python scripts/validate_backtest_report.py \
            --report /tmp/test_backtest.json \
            --min-trades 1 --min-profit-factor 0.0 \
            --allow-negative-expectancy || true
